[package]
name = "tintrail-desk"
version = "0.1.0"
description = "TintRail Desk — store paint bench"
authors = ["TintRail"]
edition = "2021"

[lib]
name = "tintrail_desk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
